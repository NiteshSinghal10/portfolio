<nav class="fixed top-0 left-0 right-0 z-[1000] transition-all duration-300"
     [ngClass]="scrolled
       ? 'py-3 bg-[rgba(10,10,15,0.92)] backdrop-blur-[16px] border-b border-white/[0.06]'
       : 'py-5'">
  <div class="max-w-[1100px] mx-auto px-6 flex items-center justify-between">

    <a class="font-mono text-[22px] font-bold text-content-primary" href="#hero">
      <span class="text-accent">&lt;</span>NS<span class="text-accent">/&gt;</span>
    </a>

    <ul class="list-none transition-all duration-300"
        [ngClass]="menuOpen
          ? 'flex flex-col items-center gap-0 fixed top-[70px] left-0 right-0 bg-[rgba(17,17,24,0.98)] backdrop-blur-[16px] py-4 pb-6 border-b border-white/[0.06] z-50'
          : 'hidden md:flex md:flex-row md:items-center md:gap-8'">
      <li *ngFor="let link of navLinks" class="md:inline-flex w-full md:w-auto text-center">
        <a [href]="link.href"
           (click)="closeMenu()"
           class="block md:inline text-[14px] font-medium text-content-secondary hover:text-content-primary py-3 md:py-0 w-full">
          {{ link.label }}
        </a>
      </li>
      <li class="mt-2 md:mt-0">
        <a class="btn btn-primary text-[13px] !px-5 !py-2"
           href="mailto:niteshsinghal9917@gmail.com"
           (click)="closeMenu()">
          Hire Me
        </a>
      </li>
    </ul>

    <button class="flex md:hidden flex-col gap-[5px] bg-transparent border-0 cursor-pointer p-1"
            (click)="toggleMenu()"
            aria-label="Toggle menu">
      <span class="block w-6 h-[2px] bg-content-primary rounded-sm transition-all duration-300"
            [class.rotate-45]="menuOpen"
            [class.translate-x-[5px]]="menuOpen"
            [class.translate-y-[7px]]="menuOpen"></span>
      <span class="block w-6 h-[2px] bg-content-primary rounded-sm transition-all duration-300"
            [class.opacity-0]="menuOpen"></span>
      <span class="block w-6 h-[2px] bg-content-primary rounded-sm transition-all duration-300"
            [class.-rotate-45]="menuOpen"
            [class.translate-x-[5px]]="menuOpen"
            [class.-translate-y-[7px]]="menuOpen"></span>
    </button>

  </div>
</nav>
