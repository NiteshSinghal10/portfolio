<section class="py-[90px]" id="education">
  <div class="max-w-[1100px] mx-auto px-6">

    <div class="text-center mb-[60px]">
      <span class="section-tag">// my background</span>
      <h2 class="text-[clamp(28px,5vw,40px)] font-bold text-content-primary leading-tight">
        Education
      </h2>
      <div class="section-line"></div>
    </div>

    <div class="flex flex-col gap-6 max-w-[760px] mx-auto">
      <div *ngFor="let edu of education"
           class="flex flex-col sm:flex-row gap-6 bg-card border border-white/[0.06] rounded-card-lg p-7 transition-all duration-200 hover:border-accent/20 hover:-translate-y-1">

        <div class="w-[52px] h-[52px] rounded-[14px] bg-gradient-accent flex items-center justify-center flex-shrink-0">
          <i [class]="edu.icon" class="text-white text-[20px]"></i>
        </div>

        <div class="flex-1">
          <div class="flex flex-wrap justify-between items-start gap-4 mb-3.5">
            <div>
              <h3 class="text-[17px] font-bold text-content-primary mb-1">{{ edu.degree }}</h3>
              <p class="text-[14px] font-semibold gradient-text">{{ edu.institution }}</p>
            </div>
            <span class="font-mono text-[12px] text-content-muted whitespace-nowrap">{{ edu.period }}</span>
          </div>
          <div class="flex flex-wrap gap-6">
            <span class="text-[13px] text-content-secondary flex items-center gap-1.5">
              <i class="fas fa-map-marker-alt text-accent"></i> {{ edu.location }}
            </span>
            <span class="text-[13px] text-content-secondary flex items-center gap-1.5">
              <i class="fas fa-star text-accent"></i> CGPA: <strong class="text-content-primary ml-1">{{ edu.cgpa }}</strong>
            </span>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
